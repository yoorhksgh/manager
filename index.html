<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0}</style>
<title>서초사옥 피로연 메뉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 청첩장 같은 종이 카드 세 장을 나란히 — 좁은 화면에서는 한 장씩 세로로 */
:root {
  --bg: #f6f4f1;
  --paper: #fffdfa;
  --ink: #26221f;
  --muted: #7a716a;
  --line: #e4ddd5;
  --accent: #9a6b4f;
  --c-lishan: #a3402f;
  --c-haru: #2f5d62;
  --c-mad: #6e7d3a;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1917; --paper: #24211e; --ink: #ece6df; --muted: #a59c93; --line: #3a3530;
    --accent: #d1a184; --c-lishan: #e07a63; --c-haru: #7fb4b9; --c-mad: #b3c47a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1917; --paper: #24211e; --ink: #ece6df; --muted: #a59c93; --line: #3a3530;
  --accent: #d1a184; --c-lishan: #e07a63; --c-haru: #7fb4b9; --c-mad: #b3c47a;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  line-height: 1.6;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 48px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 36px;
}
header { display: grid; gap: 8px; text-align: left; }
.eyebrow {
  font-size: 12px; letter-spacing: 0.18em; color: var(--accent); font-weight: 500;
}
h1 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(28px, 5vw, 40px); line-height: 1.25; margin: 0; text-wrap: balance;
}
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

nav { display: flex; flex-wrap: wrap; gap: 8px; }
nav a {
  font-size: 13px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  background: var(--paper);
}
nav a:hover, nav a:focus-visible { border-color: var(--accent); outline: none; }
nav a span { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  align-items: start;
}
.card {
  --tone: var(--accent);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 32px 28px 28px;
  display: grid; gap: 22px;
  min-width: 0;
  position: relative;
  scroll-margin-top: 16px;
}
.card::before {
  content: ""; position: absolute; inset: 8px;
  border: 1px solid var(--line); border-radius: 2px; pointer-events: none;
}
.card.lishan { --tone: var(--c-lishan); }
.card.haru   { --tone: var(--c-haru); }
.card.mad    { --tone: var(--c-mad); }

.card-head { display: grid; gap: 6px; text-align: center; position: relative; }
.emoji {
  width: 84px; height: 84px; margin: 0 auto 6px;
  display: grid; place-items: center;
  font-size: 40px; line-height: 1;
  border-radius: 50%;
  background: color-mix(in srgb, var(--tone) 14%, var(--paper));
  border: 2px solid color-mix(in srgb, var(--tone) 35%, var(--paper));
}
.emoji svg { width: 64px; height: 64px; display: block; overflow: visible; }
@media (prefers-reduced-motion: no-preference) {
  .emoji { transition: transform .25s ease; }
  .card:hover .emoji { transform: translateY(-4px) rotate(-6deg); }
}
.cuisine {
  font-size: 11px; letter-spacing: 0.22em; color: var(--tone); font-weight: 700;
}
.card h2 {
  font-family: var(--f-display); font-weight: 700; font-size: 26px; margin: 0;
}
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rule {
  width: 40px; height: 1px; background: var(--tone); margin: 4px auto 0; opacity: .7;
}
ul.menu {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative;
}
ul.menu li {
  display: flex; justify-content: center; text-align: center;
  padding: 11px 4px;
  border-bottom: 1px dashed var(--line);
}
ul.menu li:last-child { border-bottom: 0; }
.name { font-family: var(--f-display); font-size: 17px; min-width: 0; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>서초사옥 피로연 메뉴</h1>
  </header>

  <section class="cards">
    <article class="card lishan" id="lishan">
      <div class="card-head">
        <div class="emoji" role="img" aria-label="중식"><svg viewBox="0 0 80 80" aria-hidden="true"><g fill="none" stroke="#c9b3a0" stroke-width="2.4" stroke-linecap="round"><path d="M28 6 q-4 4 0 8 q4 4 0 8"/><path d="M52 6 q-4 4 0 8 q4 4 0 8"/></g><path d="M10 54 C10 36 24 26 40 26 C56 26 70 36 70 54 C70 64 57 68 40 68 C23 68 10 64 10 54 Z" fill="#FFF4E0" stroke="#5B4033" stroke-width="2.6" stroke-linejoin="round"/><path d="M29 31 q3 5 1 10 M40 28 v12 M51 31 q-3 5 -1 10" fill="none" stroke="#5B4033" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="24" cy="57" rx="4.5" ry="2.8" fill="#FFADAD"/><ellipse cx="56" cy="57" rx="4.5" ry="2.8" fill="#FFADAD"/><circle cx="31" cy="51" r="3" fill="#3B2A20"/><circle cx="49" cy="51" r="3" fill="#3B2A20"/><circle cx="32" cy="50" r="1" fill="#fff"/><circle cx="50" cy="50" r="1" fill="#fff"/><path d="M36.5 55 q3.5 3.5 7 0" fill="none" stroke="#3B2A20" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="cuisine">CHINESE</div>
        <h2>리샨</h2>
        <div class="count">중식 · 6가지</div>
        <div class="rule"></div>
      </div>
      <ul class="menu">
        <li><span class="name">유산슬</span></li>
        <li><span class="name">와사비크림새우</span></li>
        <li><span class="name">쿵파우치킨</span></li>
        <li><span class="name">탕수육</span></li>
        <li><span class="name">짜장면</span></li>
        <li><span class="name">찹쌀깨빵</span></li>
      </ul>
    </article>

    <article class="card haru" id="haru">
      <div class="card-head">
        <div class="emoji" role="img" aria-label="일식"><svg viewBox="0 0 80 80" aria-hidden="true"><rect x="13" y="38" width="54" height="28" rx="14" fill="#FFFFFF" stroke="#4A3A33" stroke-width="2.6"/><path d="M9 42 C13 27 29 22 42 24 C57 26 69 31 71 42 C60 47 21 47 9 42 Z" fill="#FF9466" stroke="#4A3A33" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 29 l5 12 M36 26 l4 15 M49 27 l2 15 M60 31 l0 11" stroke="#FFD9C4" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="24" cy="58" rx="4.5" ry="2.6" fill="#FFADAD"/><ellipse cx="56" cy="58" rx="4.5" ry="2.6" fill="#FFADAD"/><circle cx="31" cy="53" r="3" fill="#3B2A20"/><circle cx="49" cy="53" r="3" fill="#3B2A20"/><circle cx="32" cy="52" r="1" fill="#fff"/><circle cx="50" cy="52" r="1" fill="#fff"/><path d="M36.5 57 q3.5 3.5 7 0" fill="none" stroke="#3B2A20" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="cuisine">JAPANESE</div>
        <h2>갓포하루</h2>
        <div class="count">일식 · 7가지</div>
        <div class="rule"></div>
      </div>
      <ul class="menu">
        <li><span class="name">코바치 3종</span></li>
        <li><span class="name">찜전복</span></li>
        <li><span class="name">사시미 모리아와세 5종</span></li>
        <li><span class="name">스시 6종</span></li>
        <li><span class="name">오징어먹물튀김</span></li>
        <li><span class="name">후토마키</span></li>
        <li><span class="name">사누끼우동</span></li>
      </ul>
    </article>

    <article class="card mad" id="mad">
      <div class="card-head">
        <div class="emoji" role="img" aria-label="양식"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M14 44 C16 30 28 22 40 22 C52 22 64 30 66 44 Z" fill="#FFD36E" stroke="#4A3A33" stroke-width="2.6" stroke-linejoin="round"/><path d="M21 40 q7 -10 14 -4 q8 6 15 -5 M25 33 q9 -8 19 -2" fill="none" stroke="#E8A93A" stroke-width="2.2" stroke-linecap="round"/><path d="M29 29 C33 21 48 21 51 29 C48 34 33 34 29 29 Z" fill="#E8533F"/><path d="M45 21 q6 -7 11 -1 q-6 5 -11 1 Z" fill="#5BAA5B" stroke="#3E7F3E" stroke-width="1.2"/><path d="M10 44 H70 C70 59 57 69 40 69 C23 69 10 59 10 44 Z" fill="#FFFFFF" stroke="#4A3A33" stroke-width="2.6" stroke-linejoin="round"/><path d="M12.5 50 H67.5" stroke="#8EC5E8" stroke-width="3"/><ellipse cx="24" cy="60" rx="4.5" ry="2.6" fill="#FFADAD"/><ellipse cx="56" cy="60" rx="4.5" ry="2.6" fill="#FFADAD"/><circle cx="31" cy="56" r="3" fill="#3B2A20"/><circle cx="49" cy="56" r="3" fill="#3B2A20"/><circle cx="32" cy="55" r="1" fill="#fff"/><circle cx="50" cy="55" r="1" fill="#fff"/><path d="M36.5 60 q3.5 3.5 7 0" fill="none" stroke="#3B2A20" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="cuisine">ITALIAN</div>
        <h2>매드포갈릭</h2>
        <div class="count">양식 · 6가지</div>
        <div class="rule"></div>
      </div>
      <ul class="menu">
        <li><span class="name">양송이 수프</span></li>
        <li><span class="name">시저샐러드</span></li>
        <li><span class="name">마늘빵</span></li>
        <li><span class="name">채끝 스테이크</span></li>
        <li><span class="name">김치볶음밥</span></li>
        <li><span class="name">감자튀김</span></li>
      </ul>
    </article>
  </section>

</div>
</body>
</html>
